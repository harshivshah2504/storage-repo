name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The client id is public by design in the device flow - there is no secret in the APK.
      # Set it as a repository variable named GH_OAUTH_CLIENT_ID (Settings > Secrets and variables
      # > Actions > Variables), or the build falls back to the placeholder and sign-in will refuse.
      # With no keystore secrets set, the release APK is signed with the debug key instead.
      # It still installs; it just cannot be updated in place by a later differently-signed build.
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret set - the release APK will be debug-signed."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "GD_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "GD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "GD_KEY_ALIAS=$KEY_ALIAS"
            echo "GD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease \
            -PgithubOauthClientId="${{ vars.GH_OAUTH_CLIENT_ID }}"

      - name: Rename APK
        working-directory: android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release*.apk out/memvault.apk
          # R8 renames everything; without this file a release crash trace is unreadable.
          cp app/build/outputs/mapping/release/mapping.txt out/mapping.txt || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: memvault-apk
          path: |
            android/out/memvault.apk
            android/out/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/memvault.apk
